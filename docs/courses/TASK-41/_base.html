  <!-- Set the theme before first paint so dark mode never flashes white.
       main.js owns the toggle + persistence; this only picks the initial value.
       Copy as-is — no per-course customization needed. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('course-theme');
        document.documentElement.dataset.theme =
          t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
