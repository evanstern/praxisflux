# ci — every PR (and main) must be green AND honest about versions before it can release.
# Mirrors .githooks/pre-commit (tests + catalog/version consistency) and adds the two things a
# local hook can't be trusted with: a successful package build and the version-bump gate
# (core.hooksPath is per-clone, so CI is the authoritative enforcement point).
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags: merge-base and tag-reuse checks need them
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: tests
        run: node --test
      - name: marketplace catalog in sync
        run: node scripts/gen-marketplace.mjs --check
      - name: versions consistent (lockstep)
        run: node scripts/sync-version.mjs --check
      - name: plugins package cleanly
        run: node scripts/build.mjs
      - name: README/CLAUDE.md name what the repo ships
        run: node scripts/check-docs.mjs
      # This repo's own repo-STATE self-checks. They live HERE, not in `node --test`: mid-PR
      # they are red by construction (spec 057), so the per-commit path is the wrong home —
      # but the PR head is exactly where end-state invariants belong. test/run-gates.test.mjs
      # asserts both steps stay present, because spec-bridge previously had no CI step at all
      # and its only enforcement was the test spec 057 moved out.
      - name: this repo's board is honest (spec-bridge)
        run: node scripts/run-gates.mjs --gates spec-bridge --path .
      - name: this repo's grounding wiki is fresh
        run: node scripts/run-gates.mjs --gates wiki-freshness --path .
      # This repo dogfoods pdlc:bootstrap, so its CLAUDE.md carries a PLANTED grounding block
      # stamped with the plugin version that planted it. `plant.mjs --check` has always exited 1
      # on a stale or drifted footprint — but until spec 066 NOTHING invoked it (verified by grep
      # over .github/, .githooks/, scripts/), which is how praxis ran a v0.57.0 block against a
      # v0.63.1 marketplace: six versions stale, unnoticed. A working gate no surface runs is not
      # a gate.
      #
      # Same DEFECT SHAPE as the dispatch record this spec's R3 addresses — written doctrine with
      # no residue any gate enforces — over a DIFFERENT artifact (a planted block vs. a board
      # card). The mechanisms stay separate on purpose: this one asks "does the planted footprint
      # match what the installed plugin plants?", checkBridge asks "did the claimed work leave the
      # record it owes?". Neither can answer the other's question, and merging them would couple
      # a release-hygiene check to board state.
      #
      # A repo-STATE self-check, so it belongs HERE and not in `node --test`, pre-commit, or
      # check-docs.mjs: the BEGIN marker quotes the version, so a marketplace bump drifts the
      # block by construction until the re-plant lands in the same PR — exactly the mid-PR
      # redness spec 057 moved out of the per-commit path. `--peer backlog` must match what
      # .pdlc records; a different peer set strips or adds block sections and reads as drift.
      - name: this repo's own planted PDLC block is current
        run: node pdlc/scripts/plant.mjs --root . --peer backlog --check
      - name: version bumped when released surface changed
        if: github.event_name == 'pull_request'
        run: node scripts/check-version-bump.mjs --base "origin/${{ github.base_ref }}"

  # The marketplace install path, proven — not assumed. Simulates what installing a plugin does
  # (copy with the lib -> ../lib symlink dereferenced into a real directory), then spawns each
  # plugin's Stop hook exactly as Claude Code does (hooks.json command, fake hook JSON on stdin)
  # against clean and violating fixtures, asserting exit codes. Also runs inside `node --test`
  # above; this job keeps the install-path signal its own visible check.
  install-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: marketplace install simulation — dereferenced copy, Stop hooks spawned e2e
        run: node --test test/install-path.test.mjs
